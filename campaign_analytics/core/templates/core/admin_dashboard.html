<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Welcome, {{ username }} (Admin)</h2>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6>Total Customers</h6>
                    <h3>{{ total_customers }}</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6>Converted</h6>
                    <h3 class="text-success">{{ total_converted }}</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6>Not Converted</h6>
                    <h3 class="text-danger">{{ total_not_converted }}</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 text-center">
                    <h6>Avg Conversion Rate</h6>
                    <h3>{{ avg_conversion_rate }}</h3>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Conversion Ratio</h5>
                    <canvas id="conversionPie"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Conversion Rate by Channel</h5>
                    <canvas id="channelBar"></canvas>
                </div>
            </div>
        </div>
        <a href="{% url 'predict' %}" class="btn btn-primary mt-4">Run Prediction</a>
        <a href="/admin/" class="btn btn-secondary mt-4">Manage Users & Groups</a>
        <a href="{% url 'logout' %}" class="btn btn-outline-secondary mt-4">Log Out</a>
    </div>

    <script>
        new Chart(document.getElementById('conversionPie'), {
            type: 'pie',
            data: {
                labels: ['Converted', 'Not Converted'],
                datasets: [{
                    data: [{{ total_converted }}, {{ total_not_converted }}],
                    backgroundColor: ['#198754', '#dc3545']
                }]
            }
        });

        new Chart(document.getElementById('channelBar'), {
            type: 'bar',
            data: {
                labels: {{ channel_labels|safe }},
                datasets: [{
                    label: 'Conversion Rate',
                    data: {{ channel_values|safe }},
                    backgroundColor: '#0d6efd'
                }]
            }
        });
    </script>
</body>
</html>
